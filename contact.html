    <h1 class="page__title">Let&rsquo;s connect.</h1>
    <p class="page__lede">Have a project in mind? Send a note &mdash; it lands straight in my inbox.</p>
    <!-- 정적 사이트라 서버로 전송하지 않는다: 제출하면 작성한 내용으로 메일 앱(mailto)이 열린다. -->
    <form class="contact-form" id="contact-form" novalidate>
      <div class="contact-form__row">
        <label class="contact-form__field">
          <span>Name</span>
          <input type="text" name="name" placeholder="Your name" autocomplete="name" required />
        </label>
        <label class="contact-form__field">
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </label>
      </div>
      <label class="contact-form__field">
        <span>Message</span>
        <textarea name="message" rows="4" placeholder="Tell me about your project" required></textarea>
      </label>
      <div class="contact-form__foot">
        <button class="contact-form__submit" type="submit"><span>Send message</span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="contact-form__sent" role="status" hidden>Thank you! Your mail app is opening.</p>
      </div>
    </form>
  </main>
