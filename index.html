  <template id="tpl-flatbed-microwave-oven">
      <img src="assets/img/portfolio/flatbed-microwave-oven/m-1.jpg" width="1600" height="1066" loading="lazy" alt="Flatbed Microwave Oven (페이지 업데이트 예정) — 1" />
      <div class="module-text"><dl class="module-facts"><div><dt>Project Name</dt><dd>Flatbed MWO (Microwave oven)</dd></div><div><dt>Industry</dt><dd>Electronics</dd></div><div><dt>Role</dt><dd>Project Lead</dd></div><div><dt>Client</dt><dd>LG Electronics</dd></div><div><dt>Tools</dt><dd>Claude, Firefly, Photoshop</dd></div><div><dt>Duration</dt><dd>2026.05</dd></div></dl></div>
      <div class="module-text"><div>LG 플랫배드 전자레인지 신제품의 호주 시장향 PDP 디자인 프로젝트입니다. 바쁜 일상과 다기능 가전에 대한 수요가 높은 호주 시장에서, 이 프로젝트의 핵심 과제는 플랫배드의 핵심 가치인 넓은 내부 공간을 어떻게 시각화할 것인가였습니다. 제품 최종컷 없이 더미 기준으로 작업을 먼저 시작하고, Claude로 호주 현지 식문화와 와트별 적합 음식을 리서치한 뒤 Firefly로 이미지를 생성했습니다. 한 달 후 제품컷 수급 이후 리터치 및 디테일 수정으로 완성했습니다.</div><div>A PDP design project for LG's new Flatbed Microwave Oven, targeting the Australian market. Australia's microwave oven market is growing, driven by demand for time-efficient, multi-functional appliances. The challenge was communicating the Flatbed's core value — more usable interior space — without final product shots. Design work began with dummy assets, while Firefly was used to generate food imagery based on wattage-appropriate, locally familiar Australian dishes researched via Claude. Final product shots were integrated a month later through retouching and detail refinement.</div></div>
      <img src="assets/img/portfolio/flatbed-microwave-oven/m-2.jpg" width="1600" height="1815" loading="lazy" alt="Flatbed Microwave Oven (페이지 업데이트 예정) — 2" />
      <img src="assets/img/portfolio/flatbed-microwave-oven/m-3.jpg" width="1600" height="900" loading="lazy" alt="Flatbed Microwave Oven (페이지 업데이트 예정) — 3" />
      <div class="module-text"><div>글로벌하게 대중적이면서 호주 로컬 취향에 맞춘 음식으로 제품 기능을 시각적으로 전달하고,</div><div>우드톤·자연광 기반의 웜한 라이프스타일 톤으로 일상적인 사용 장면을 보여줌으로써</div><div>제품에 대한 친근감과 신뢰도를 높이는 방향으로 설계했습니다.</div></div>
  </template>
